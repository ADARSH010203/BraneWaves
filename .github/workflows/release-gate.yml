name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.lock
      - name: Verify Python dependency consistency
        run: pip check
      - name: Audit frozen Python dependency graph
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.lock \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  production-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release smoke environment
        run: |
          cat > .env <<'EOF'
          JWT_SECRET_KEY=release-gate-secret-key-at-least-32-characters
          GROQ_API_KEY=release-gate-placeholder
          FRONTEND_URL=http://localhost:3000
          ALLOWED_ORIGINS=["http://localhost:3000"]
          REFRESH_COOKIE_SAMESITE=lax
          NEXT_PUBLIC_API_URL=http://localhost:8000
          NEXT_PUBLIC_WS_URL=ws://localhost:8000
          EOF
      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config -q
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
      - name: Start production stack
        run: docker compose -f docker-compose.prod.yml up -d
      - name: Wait for API and frontend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready >/dev/null               && curl -fsS http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps
          exit 1
      - name: Show container state
        if: always()
        run: docker compose -f docker-compose.prod.yml ps
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=200
      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
