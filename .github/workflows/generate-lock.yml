name: Generate frontend lockfile

on:
  push:
    branches:
      - fix/phase4-product-integration

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phase4-product-integration
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Generate package-lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "deps: add reproducible frontend lockfile"
          git push origin HEAD:fix/phase4-product-integration
