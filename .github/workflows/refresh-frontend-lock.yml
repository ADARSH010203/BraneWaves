name: Refresh Frontend Lock

on:
  push:
    branches: [fix/runtime-capabilities-search-release]
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-capabilities-search-release
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh npm lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install and production audit
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "deps: refresh frontend lockfile"
          git push origin HEAD:fix/runtime-capabilities-search-release
