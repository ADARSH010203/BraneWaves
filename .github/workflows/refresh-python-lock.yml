name: Refresh Python Lock

on:
  push:
    branches: [fix/runtime-capabilities-search-release]
    paths:
      - backend/requirements.txt

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-capabilities-search-release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate frozen lock
        run: |
          python -m pip install --upgrade pip pip-tools
          cd backend
          pip-compile requirements.txt \
            --output-file requirements.lock \
            --resolver backtracking \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Verify generated lock installs
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.lock
          pip check
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- backend/requirements.lock; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.lock
          git commit -m "deps: refresh Python lockfile"
          git push origin HEAD:fix/runtime-capabilities-search-release
