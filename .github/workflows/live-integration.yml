name: Live Integration Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_golden_evals:
        description: "Also run the 5-task live golden evaluation"
        required: false
        default: false
        type: boolean

jobs:
  live:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ["27017:27017"]
      redis:
        image: redis:7.0-alpine
        ports: ["6379:6379"]
    env:
      PYTHONPATH: backend
      MONGO_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: live-smoke-secret-key-at-least-32-characters
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WEB_SEARCH_PROVIDER: auto
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      PYTHON_SANDBOX_URL: ${{ secrets.PYTHON_SANDBOX_URL }}
      PYTHON_SANDBOX_API_KEY: ${{ secrets.PYTHON_SANDBOX_API_KEY }}
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install frozen dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.lock
      - name: Verify live web, paper and dataset providers
        run: python backend/evals/provider_smoke.py
      - name: Require live Groq secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY repository secret is required for real LLM verification."
            exit 1
          fi
      - name: Verify live LLM and configured optional sandbox
        run: python backend/evals/live_smoke.py
      - name: Run live golden evaluations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_golden_evals }}
        run: python backend/evals/run_eval.py
