name: Live Integration Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_golden_evals:
        description: "Also run the 5-task live golden evaluation"
        required: false
        default: false
        type: boolean

jobs:
  live:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ["27017:27017"]
      redis:
        image: redis:7.0-alpine
        ports: ["6379:6379"]
    env:
      PYTHONPATH: backend
      MONGO_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: live-smoke-secret-key-at-least-32-characters
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WEB_SEARCH_PROVIDER: auto
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      PYTHON_SANDBOX_URL: ${{ secrets.PYTHON_SANDBOX_URL }}
      PYTHON_SANDBOX_API_KEY: ${{ secrets.PYTHON_SANDBOX_API_KEY }}
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install frozen dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.lock
      - name: Verify live research providers
        run: python backend/evals/provider_smoke.py
      - name: Warn when production search secret is missing
        if: ${{ env.BRAVE_SEARCH_API_KEY == '' && env.TAVILY_API_KEY == '' && env.SERPER_API_KEY == '' }}
        run: echo "::warning::No Brave/Tavily/Serper secret is configured; production web search has not been live-verified."
      - name: Require production search secret for manual full verification
        if: ${{ github.event_name == 'workflow_dispatch' && env.BRAVE_SEARCH_API_KEY == '' && env.TAVILY_API_KEY == '' && env.SERPER_API_KEY == '' }}
        run: |
          echo "Configure BRAVE_SEARCH_API_KEY, TAVILY_API_KEY, or SERPER_API_KEY for full web-search verification."
          exit 1
      - name: Warn when Groq secret is missing
        if: ${{ github.event_name != 'workflow_dispatch' && env.GROQ_API_KEY == '' }}
        run: echo "::warning::GROQ_API_KEY is not configured; real LLM smoke is skipped on this automatic run."
      - name: Require Groq secret for manual full verification
        if: ${{ github.event_name == 'workflow_dispatch' && env.GROQ_API_KEY == '' }}
        run: |
          echo "GROQ_API_KEY repository secret is required for manual full verification."
          exit 1
      - name: Verify live LLM and configured optional sandbox
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python backend/evals/live_smoke.py
      - name: Run live golden evaluations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_golden_evals }}
        run: python backend/evals/run_eval.py
