name: Generate backend lockfile

on:
  push:
    branches:
      - fix/phase4-product-integration

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phase4-product-integration
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --default-timeout=300 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir --default-timeout=300 -r backend/requirements.txt
          pip freeze | LC_ALL=C sort > backend/requirements.lock
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- backend/requirements.lock && git ls-files --error-unmatch backend/requirements.lock >/dev/null 2>&1; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.lock
          git commit -m "deps: add reproducible backend lockfile"
          git push origin HEAD:fix/phase4-product-integration
